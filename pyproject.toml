[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squad1"
version = "1.0.0"
description = "PRANA-G Squad 1 (Generative & Inverse Core + Conditioning): contracts, physics, hard-constraint projection, conditioning, generation, PINN training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.2",
]

[project.optional-dependencies]
chem = ["pandas>=2.0", "scikit-learn>=1.3", "pyarrow>=12"]
mesh = ["trimesh>=4.0"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "pyarrow>=12", "trimesh>=4.0", "sympy>=1.12"]

[project.scripts]
squad1 = "squad1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
  "slow: takes more than ~20 s on CPU (still run in CI)",
  "gpu: requires a CUDA device (skipped automatically when unavailable)",
]
filterwarnings = [
  "ignore:enable_nested_tensor is True:UserWarning",
  "ignore:.torch.jit.script. is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E741", "RUF002", "RUF003", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117", "E702", "E701", "E501", "C408", "RUF059", "RUF046", "F841", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/squad1"]

[tool.coverage.run]
source = ["squad1"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
